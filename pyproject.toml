[project]
name = "devign-leakage"
version = "0.1.0"
description = "Devign's cross-split leakage is smaller than assumed, but every exact duplicate in its test set is labelled inconsistently."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
fetch = ["huggingface_hub>=0.34"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
